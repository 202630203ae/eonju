<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>살까말까 - 합리적인 소비 도우미</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --background-color: #F5F7FA;
            --card-background: #FFFFFF;
            --text-color: #333333;
            --border-radius: 10px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .card {
            background: var(--card-background);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357ABD;
        }

        .item-list {
            list-style: none;
            padding: 0;
        }

        .item-card {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .item-card .rank {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .item-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .item-detail {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .opportunity-cost {
            background-color: #FFF9E6;
            border-left: 4px solid #FFC107;
            padding: 10px;
            margin-top: 10px;
            font-size: 13px;
        }

        .delete-btn {
            background-color: #ff4d4d;
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤔 살까말까</h1>
        <p>사고 싶은 물건의 기회비용과 우선순위를 측정해 드립니다.</p>
    </header>

    <!-- 입력 폼 -->
    <div class="card">
        <h2>위시리스트 물건 추가</h2>
        <form id="itemForm">
            <div class="form-group">
                <label for="itemName">물건 이름</label>
                <input type="text" id="itemName" placeholder="예: 아이패드 프로 11인치" required>
            </div>
            <div class="form-group">
                <label for="itemPrice">가격 (원)</label>
                <input type="number" id="itemPrice" placeholder="예: 1200000" required>
            </div>
            <div class="form-group">
                <label for="itemSpecs">사양 / 특징 (옵션)</label>
                <textarea id="itemSpecs" placeholder="예: M4 칩, 256GB, 스페이스 블랙, 공부 및 영상 편집용"></textarea>
            </div>
            <div class="form-group">
                <label for="itemNeed">필요도 점수 (1 ~ 10점)</label>
                <select id="itemNeed">
                    <option value="1">1점 - 그냥 예뻐서 갖고 싶음</option>
                    <option value="3">3점 - 있으면 가끔 쓸 것 같음</option>
                    <option value="5">5점 - 있으면 삶의 질이 오름</option>
                    <option value="8">8점 - 일/학업에 직접적으로 도움 됨</option>
                    <option value="10">10점 - 없으면 안 되는 필수품</option>
                </select>
            </div>
            <button type="submit">등록 및 기회비용 측정하기</button>
        </form>
    </div>

    <!-- 결과 리스트 -->
    <div class="card">
        <h2>소비 우선순위 목록</h2>
        <p style="font-size: 12px; color: #777;">* 우선순위 점수(필요도 ÷ 가격)가 높은 순으로 정렬됩니다.</p>
        <div id="itemList" class="item-list">
            <!-- 등록된 아이템들이 여기에 표시됩니다 -->
        </div>
    </div>
</div>

<script>
    // 입력한 아이템들을 저장할 배열
    let items = [];

    // 폼 제출 이벤트 처리
    document.getElementById('itemForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 입력값 가져오기
        const name = document.getElementById('itemName').value;
        const price = parseInt(document.getElementById('itemPrice').value);
        const specs = document.getElementById('itemSpecs').value || '사양 정보 없음';
        const need = parseInt(document.getElementById('itemNeed').value);

        // 우선순위 점수 계산 (필요도 / 가격 * 1,000,000) -> 가성비 및 필요성 기준
        // 점수가 높을수록 저렴하고 필요도가 높음
        const priorityScore = (need / price) * 1000000;

        // 아이템 객체 생성
        const newItem = {
            id: Date.now(),
            name: name,
            price: price,
            specs: specs,
            need: need,
            score: priorityScore
        };

        // 배열에 추가 후 정렬 (점수 내림차순)
        items.push(newItem);
        items.sort((a, b) => b.score - a.score);

        // UI 갱신 및 폼 리셋
        renderItems();
        document.getElementById('itemForm').reset();
    });

    // 기회비용 텍스트 생성 함수
    function calculateOpportunityCost(price) {
        // 일상적인 소비 요소들과 비교
        const coffee = Math.floor(price / 5000); // 5000원 아메리카노 기준
        const chicken = Math.floor(price / 20000); // 20000원 치킨 기준
        const workingHours = (price / 10030).toFixed(1); // 2025년 최저시급(10,030원) 기준 약 몇 시간 작업량인지

        return `💡 <strong>기회비용:</strong> 이 돈이면 <strong>아메리카노 ${coffee.toLocaleString()}잔</strong>, <strong>치킨 ${chicken.toLocaleString()}마리</strong>를 먹을 수 있습니다. (2025년 최저시급 기준 약 <strong>${workingHours}시간</strong> 일해야 하는 금액)`;
    }

    // 화면에 목록을 출력하는 함수
    function renderItems() {
        const itemListEl = document.getElementById('itemList');
        itemListEl.innerHTML = '';

        if (items.length === 0) {
            itemListEl.innerHTML = '<p style="text-align: center; color: #888;">등록된 물건이 없습니다. 위에서 물건을 추가해 보세요!</p>';
            return;
        }

        items.forEach((item, index) => {
            const itemCard = document.createElement('div');
            itemCard.className = 'item-card';

            itemCard.innerHTML = `
                <span class="rank">우선순위 ${index + 1}위</span>
                <h3 class="item-title">${item.name}</h3>
                <div class="item-detail"><strong>가격:</strong> ${item.price.toLocaleString()} 원</div>
                <div class="item-detail"><strong>필요도:</strong> ${item.need} / 10 점</div>
                <div class="item-detail"><strong>사양:</strong> ${item.specs}</div>
                <div class="opportunity-cost">
                    ${calculateOpportunityCost(item.price)}
                </div>
                <button class="delete-btn" onclick="deleteItem(${item.id})">삭제</button>
            `;

            itemListEl.appendChild(itemCard);
        });
    }

    // 아이템 삭제 함수
    function deleteItem(id) {
        items = items.filter(item => item.id !== id);
        renderItems();
    }

    // 초기 실행 시 빈 목록 안내 출력
    renderItems();
</script>

</body>
</html>
